name: Deploy DrawCircuit

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (auto detects changes since each successful publication)
        type: choice
        default: auto
        options: [auto, web, desktop, both]

permissions:
  contents: read

# Serialize releases and compare with successful channel tags. Queued or failed
# runs cannot discard changes; publication is never cancelled halfway through.
concurrency:
  group: drawcircuit-releases
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.plan.outputs.web }}
      desktop: ${{ steps.plan.outputs.desktop }}
      web_version: ${{ steps.plan.outputs.web_version }}
      desktop_version: ${{ steps.plan.outputs.desktop_version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Test release routing
        run: npm run test:release
      - name: Plan independent releases
        id: plan
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'auto' }}
        run: npm run release:plan

  validate:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Prepare audit output directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /private/tmp
      - run: npm run test -- --maxWorkers=2 --testTimeout=30000

  build:
    needs: [changes, validate]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      DRAWCIRCUIT_VERSION: ${{ needs.changes.outputs.web_version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: [changes, build]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - uses: actions/checkout@v7.0.1
      - name: Verify deployed identity before advancing the web channel
        env:
          DRAWCIRCUIT_VERSION: ${{ needs.changes.outputs.web_version }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch(`https://andrelombardo.github.io/drawcircuit/version.json?commit=${process.env.GITHUB_SHA}`);
          if (!response.ok) throw new Error(`Pages returned ${response.status}`);
          const metadata = await response.json();
          if (metadata.commit !== process.env.GITHUB_SHA || metadata.version !== process.env.DRAWCIRCUIT_VERSION || metadata.channel !== 'web') throw new Error('Pages has a different build');
          console.log(metadata);
          JS
      - name: Mark successful web release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.changes.outputs.web_version }}
        run: gh api repos/${{ github.repository }}/git/refs -f ref="refs/tags/web-v${VERSION}" -f sha="$GITHUB_SHA"

  desktop-build:
    needs: [changes, validate]
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      DRAWCIRCUIT_VERSION: ${{ needs.changes.outputs.desktop_version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ matrix.runner }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm run build:desktop-ui
      - run: npm run desktop:test -- --locked
      - name: Build signed app and updater package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY in repository Secrets'; exit 1; }
          npm run desktop:build -- --config "{\"version\":\"$DRAWCIRCUIT_VERSION\"}" --ci
          node scripts/package-macos.mjs
          node scripts/release/collect-macos.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.arch }}
          path: release-artifacts/
          if-no-files-found: error

  desktop-release:
    needs: [changes, desktop-build]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRAWCIRCUIT_VERSION: ${{ needs.changes.outputs.desktop_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release-artifacts/
          merge-multiple: true
      - name: Verify both signatures and prepare updater manifest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          node scripts/release/manifest.mjs
      - name: Publish complete macOS release
        run: node scripts/release/publish-desktop.mjs
      - name: Verify public updater identity
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://github.com/andrelombardo/drawcircuit/releases/latest/download/latest.json');
          if (!response.ok) throw new Error(`Updater returned ${response.status}`);
          const manifest = await response.json();
          if (manifest.version !== process.env.DRAWCIRCUIT_VERSION || !manifest.notes.includes(process.env.GITHUB_SHA)) throw new Error('Updater has a different release');
          for (const arch of ['aarch64', 'x86_64']) {
            const target = manifest.platforms[`darwin-${arch}`];
            if (!target?.signature || !target.url.includes(`/desktop-v${manifest.version}/`)) throw new Error(`Invalid ${arch} update`);
          }
          console.log(`Public updater ${manifest.version}: Apple Silicon + Intel`);
          JS
