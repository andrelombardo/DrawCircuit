<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>DrawCircuit · Current golden QA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const zoom = Number(new URLSearchParams(location.search).get('zoom') || 1);
      localStorage.setItem('drawcircuit.zoom.v1', JSON.stringify(zoom));
      const { createWire, createJunction } = await import('/src/model/factories.ts');
      const { createCurrent } = await import('/src/annotations/electrical.ts');
      const { useEditorStore } = await import('/src/store/editorStore.ts');
      const wire = {
        ...createWire(
          { kind: 'free', point: { x: -220, y: 0 } },
          { kind: 'free', point: { x: 220, y: 0 } },
        ),
        id: 'golden-wire',
        color: '#171717',
      };
      const doc = {
        version: 1,
        title: 'Current golden 50 / 100 / 200%',
        objects: [
          wire,
          { ...createJunction({ x: -220, y: 0 }, 'A'), id: 'golden-a' },
          { ...createJunction({ x: 220, y: 0 }, 'B'), id: 'golden-b' },
        ],
      };
      const current = {
        ...createCurrent(wire, { x: 0, y: 0 }, doc, 'inline'),
        id: 'golden-current',
        color: '#e32636',
      };
      current.label.text = 'i_1';
      doc.objects.push(current);
      useEditorStore.setState({
        document: doc,
        selection: [],
        past: [],
        future: [],
        tool: 'select',
        grid: true,
      });
      await import('/src/main.tsx');
      // This dev-only harness records the same real PNG export used by the dialog.
      const { exportPNG } = await import('/src/png/exporter.ts');
      const png = await exportPNG(doc);
      const reader = new FileReader();
      reader.readAsDataURL(png);
      await new Promise((resolve) => (reader.onload = resolve));
      const artifact = document.createElement('script');
      artifact.id = 'qa-png';
      artifact.type = 'application/json';
      artifact.textContent = JSON.stringify({ png: reader.result });
      document.body.append(artifact);
    </script>
  </body>
</html>
